<svg xmlns="http://www.w3.org/2000/svg" width="650" height="170" viewBox="0 0 650 170">
  <defs>
    <linearGradient id="borderAnim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF003C">
        <animate attributeName="stop-color" values="#FF003C;#0070FF;#FF003C" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0070FF">
        <animate attributeName="stop-color" values="#0070FF;#FF003C;#0070FF" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect x="0" y="0" width="650" height="170" rx="20" fill="#0a0a0f"/>
  
  <!-- Animated border -->
  <rect x="4" y="4" width="642" height="162" rx="16" fill="none" stroke="url(#borderAnim)" stroke-width="3"/>
  
  <!-- Your original header.svg -->
  <image href="header.svg" x="25" y="10" width="600" height="150"/>
</svg>
